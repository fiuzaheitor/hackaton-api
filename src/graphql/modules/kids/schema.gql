type Kid {
  id: ID
  mom: User
  name: String
  birthDate: Float
  createdAt: Float
  createdBy: User
  updatedBy: User
  updatedAt: Float
}

input KidInput {
    mom: ID
  name: String
  birthDate: Float
  createdAt: Float
  updatedAt: Float
}

type Query {
  kid(id: ID!): Kid
  kids: [Kid]
  kidsByMom(userId: ID!): [Kid]
}

type Mutation {
  createKid(data: KidInput): Kid
  deleteKid(id: ID!): Kid
  updateKid(id: ID!, data: KidInput): Kid
}
