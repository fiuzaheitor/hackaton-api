type Vaccine {
  id: ID
  vaccineCard: VaccineCard
  name: String
  description: String
  applicationDate: Float
  createdAt: Float
  createdBy: User
  updatedAt: Float
  updatedBy: User
}

input VaccineInput {
  vaccineCard: ID
  name: String
  description: String
  applicationDate: Float
  createdAt: Float
  updatedAt: Float
}

type Query {
  vaccine(id: ID!): Vaccine
  vaccines: [Vaccine]
  vaccinesByVaccineCard(vaccineCardId: ID!): [Vaccine]
}

type Mutation {
  createVaccine(data: VaccineInput): Vaccine
  deleteVaccine(id: ID!): Vaccine
  updateVaccine(id: ID!, data: VaccineInput): Vaccine
}
