type VaccineCard {
  id: ID
  kid: Kid
  applicationDate: Float
  createdAt: Float
  createdBy: User
  updatedBy: User
  updatedAt: Float
}

input VaccineCardInput {
    kid: ID
  applicationDate: Float
  createdAt: Float
  updatedAt: Float
}

type Query {
  vaccineCard(id: ID!): VaccineCard
  vaccineCards: [VaccineCard]
  vaccineCardByKid(kidId: ID!): [VaccineCard]
}

type Mutation {
  createVaccineCard(data: VaccineCardInput): VaccineCard
  deleteVaccineCard(id: ID!): VaccineCard
  updateVaccineCard(id: ID!, data: VaccineCardInput): VaccineCard
}
